# Enciende, apaga o consulta la instancia EC2 del proyecto (para no generar costos fuera de las pruebas).
name: AWS - encender o apagar

on:
  workflow_dispatch:
    inputs:
      accion:
        description: "Acción sobre la instancia"
        type: choice
        options: [estado, encender, apagar]
        default: estado

env:
  AWS_REGION: us-east-2

jobs:
  instancia:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: ${{ inputs.accion }}
        run: |
          ID=$(aws ec2 describe-instances --filters "Name=tag:Proyecto,Values=billetera-ahorro" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          case "${{ inputs.accion }}" in
            encender) aws ec2 start-instances --instance-ids "$ID" >/dev/null && aws ec2 wait instance-running --instance-ids "$ID" ;;
            apagar)   aws ec2 stop-instances --instance-ids "$ID" >/dev/null && aws ec2 wait instance-stopped --instance-ids "$ID" ;;
          esac
          ESTADO=$(aws ec2 describe-instances --instance-ids "$ID" --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "Instancia $ID: $ESTADO" | tee -a "$GITHUB_STEP_SUMMARY"
